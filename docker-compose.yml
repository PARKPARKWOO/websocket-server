version: '3.8'

services:
  websocket-server:
    image: websocket-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTH_HOST=${AUTH_HOST:-auth-service:9090}
      - KAFKA_HOST=${KAFKA_HOST:-kafka:9092}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MV_HOST=${MV_HOST:-http://mirror-view-backend:8080}
      - "RESELL_WEBSOCKET_ENABLED=${RESELL_WEBSOCKET_ENABLED:-false}"
      - "RESELL_APPLICATION_ID=${RESELL_APPLICATION_ID:-}"
      - "WEBSOCKET_ALLOWED_ORIGINS=${WEBSOCKET_ALLOWED_ORIGINS:-}"
      - "RESELL_REDIS_CHANNEL_PREFIX=${RESELL_REDIS_CHANNEL_PREFIX:-dev-resell:*}"
    networks:
      - websocket-network
    stop_grace_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      placement:
        constraints:
          - node.role == worker
        preferences:
          - spread: node.labels.zone
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  websocket-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.9.0/24
